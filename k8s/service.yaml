apiVersion: v1
kind: Service
metadata:
  name: omnivoice-serve
  namespace: omnivoice
  labels:
    app: omnivoice-serve
spec:
  type: ClusterIP
  selector:
    app: omnivoice-serve
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

# Alternatives, if you need to reach the service from outside the cluster:
#
# NodePort:
#   spec:
#     type: NodePort
#     ports:
#       - name: http
#         port: 8000
#         targetPort: http
#         nodePort: 30800  # 30000-32767
#
# Or front it with an Ingress/Gateway that already exists in your air-gapped
# cluster instead of exposing a NodePort directly.
