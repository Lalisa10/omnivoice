apiVersion: v1
kind: ConfigMap
metadata:
  name: omnivoice-serve-config
  namespace: omnivoice
  labels:
    app: omnivoice-serve
data:
  serve_config.yaml: |
    proxy_location: HeadOnly

    http_options:
      host: 0.0.0.0
      port: 8000
      # Ray ends the request with HTTP 408 after this many seconds. Keep it
      # in sync with SpeechModel's queue_timeout_s below, which sheds the
      # same request before it reaches the GPU.
      request_timeout_s: 300

    grpc_options:
      port: 9000
      grpc_servicer_functions: []

    applications:
      - name: omnivoice
        route_prefix: /
        import_path: omnivoice.serving.api_server:application
        runtime_env: {}
        deployments:
          - name: SpeechModel
            num_replicas: 1
            max_ongoing_requests: 8
            ray_actor_options:
              num_cpus: 1
              num_gpus: 1
            user_config:
              # Safe balanced profile for an RTX 5060 Laptop GPU with 8 GB VRAM.
              max_batch_size: 2
              batch_wait_timeout_s: 0.02
              # Drop queued items older than this (seconds) instead of
              # spending GPU time on a request the client already gave up
              # on. null disables shedding.
              queue_timeout_s: 300
              # Return unusually large idle PyTorch allocations to CUDA
              # between batches; null disables trimming.
              cuda_idle_cache_limit_gib: 2.0
              cuda_cache_release_interval_s: 60.0
          - name: OmniVoiceIngress
            num_replicas: 1
            max_ongoing_requests: 64
            ray_actor_options:
              num_cpus: 1
              num_gpus: 0
