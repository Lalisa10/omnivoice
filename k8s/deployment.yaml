# OmniVoice serving deployment. See docs/serving-api.md for the HTTP API this
# exposes, and k8s/pv-pvc.yaml for the expected NFS layout.
#
# Air-gapped notes:
#   - `image:` must point at your internal registry mirror; docker.io is not
#     reachable from the cluster. Mirror the image built from this repo's
#     Dockerfile (e.g. `docker tag ... your-registry.internal/omnivoice/omnivoice-serve:v0.0.1`)
#     and push it there before applying this manifest.
#   - OMNIVOICE_MODEL points at a local directory (NFS-mounted), not a
#     Hugging Face repo id, so no network access is needed to load the model.
#   - HF_HUB_OFFLINE / TRANSFORMERS_OFFLINE are set as a safety net: if
#     anything ever falls back to a bare repo id (e.g. a missing
#     audio_tokenizer/ subdir), it fails fast instead of hanging trying to
#     reach huggingface.co.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnivoice-serve
  namespace: omnivoice
  labels:
    app: omnivoice-serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnivoice-serve
  strategy:
    # Each replica holds an entire GPU; a rolling update needs a 2nd GPU
    # free to schedule the new pod before the old one terminates. Switch to
    # Recreate if your cluster only has exactly as many GPUs as replicas.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: omnivoice-serve
    spec:
      # Uncomment and set if your internal registry requires auth:
      # imagePullSecrets:
      #   - name: omnivoice-registry-cred
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              # Label set by NVIDIA GPU Operator / Node Feature Discovery.
              # Verify on your cluster with:
              #   kubectl get nodes -o json | jq '.items[].metadata.labels["nvidia.com/gpu.product"]'
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L4
      # Adjust/remove to match however your cluster taints GPU nodes.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        # fsGroup fixes ownership on the NFS-mounted volumes for the
        # container's non-root `omnivoice` user (uid/gid 999, baked into
        # the image).
        fsGroup: 999
      containers:
        - name: omnivoice-serve
          image: your-registry.internal/omnivoice/omnivoice-serve:v0.0.1
          imagePullPolicy: IfNotPresent
          # Kubernetes supplies the Ray Serve configuration through a
          # ConfigMap, while the copy baked into the image remains the local
          # Docker default.
          command: ["serve"]
          args:
            - run
            - /etc/omnivoice/serve_config.yaml
            - --blocking
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # --- App config (read directly by omnivoice/serving) ---
            - name: OMNIVOICE_MODEL
              value: "/models/OmniVoice"
            - name: OMNIVOICE_DEVICE
              value: "cuda"
            - name: OMNIVOICE_LOG_LEVEL
              value: "INFO"
            - name: OMNIVOICE_VOICE_DIR
              value: "/data/voices"
            # Uncomment to let POST /v1/voices auto-transcribe ref_audio when
            # ref_text is omitted (otherwise that request returns 400). Whisper
            # is loaded at replica startup and costs ~1.5 GB extra VRAM.
            # OMNIVOICE_ASR_MODEL must be a local directory on air-gapped
            # clusters: mirror the ASR model onto the NFS volume and mount it
            # like /models/OmniVoice below.
            # - name: OMNIVOICE_LOAD_ASR
            #   value: "1"
            # - name: OMNIVOICE_ASR_MODEL
            #   value: "/models/whisper-large-v3-turbo"
            # --- Hugging Face / transformers cache & offline safety net ---
            - name: HF_HOME
              value: "/home/omnivoice/.cache/huggingface"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          volumeMounts:
            - name: serve-config
              mountPath: /etc/omnivoice/serve_config.yaml
              subPath: serve_config.yaml
              readOnly: true
            - name: omnivoice-nfs
              mountPath: /models/OmniVoice
              subPath: models/OmniVoice
              readOnly: true
            - name: omnivoice-nfs
              mountPath: /data/voices
              subPath: voices
              readOnly: false
            # Ray's plasma object store uses shared memory. Docker's default
            # /dev/shm (64 MiB) is too small for audio/model request objects.
            - name: ray-shm
              mountPath: /dev/shm
          resources:
            # nvidia.com/gpu request must equal limit: the device plugin
            # doesn't support fractional/overcommitted GPU scheduling.
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          # Ray's proxy becomes live before the model actor is ready. Startup
          # and liveness therefore check the proxy, while readiness calls the
          # application endpoint that reaches the eagerly-loaded model actor.
          startupProbe:
            httpGet:
              path: /-/healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: serve-config
          configMap:
            name: omnivoice-serve-config
        - name: omnivoice-nfs
          persistentVolumeClaim:
            claimName: omnivoice-nfs-pvc
        - name: ray-shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
